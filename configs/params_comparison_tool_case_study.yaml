## Parameter file for comparison_tool

# Folder containing empirical data like AlpIce.
data_folder: ../paleoalps-extension/data
# data_folder: comparison_tool/test_database/test_run_0.5
# What kind of data should be used?
# data_to_load: ['TCN_ages', 'C14_ages', 'lia_front_position']
data_to_load: ['event_ages', 'lia_front_position'] #, 'C14_ages']
# paths to the correct shapefiles or the folder with the shapefiles, both work, but when folder is given, all shapefiles in the folder will be loaded
shapefiles:
    TCN_ages: AlpIce/DataS6_AlpIce-1_GIS/AlpIce-1_ages/AlpIce1_TCN_ages.shp
    C14_ages: AlpIce/DataS6_AlpIce-1_GIS/AlpIce-1_ages/AlpIce1_14C_ages.shp
    event_ages: AlpIce/DataS6_AlpIce-1_GIS/AlpIce-1_event_age_geometry/
    lia_front_position: LIA-extents/lia_front_position.shp
# coordinate reference system for the comparison tool (especially important for the shapefiles)
target_epsg: 32632

# for the glacier model
topg_file: None 
# ensemble files are here
folder_with_simulations: ../paleoalps-extension/susten-run-paper-may/
output_nc_file: 'output.nc' # this is the pattern to find the output files in the folder_with_simulations. The * is a wildcard for any characters, so it will find all files that match this pattern.
output_nc_ts_file: 'output_ts.nc' # this is the pattern to find the output_ts files in the folder_with_simulations. The * is a wildcard for any characters, so it will find all files that match this pattern.
# Time convention (see README, "Time convention"):
# year_format: time scale used inside GLAMODAT and for start_time / end_time: -b2k = years before 2000 CE,
# -bp = years before 1950 CE (case-insensitive). Evidence ages are converted to this scale automatically.
year_format: -b2k
# calendar year (CE) at model time t = 0, i.e. model time t = year CE - model_year_ce_at_t0
# (e.g. 2000 for IGM runs with t = 0 in 2000 CE; 1950 for runs in negative years BP). Default if missing: 1950.
model_year_ce_at_t0: 1950
output_saving_frequency: 10.0

# ice mask and analysing mask
ice_mask_file: ../paleoalps-extension/susten-run-paper-may/mask-susten.shp
ice_mask_inverted: False # if True, the ice mask is drawn where ice should be, if False, the ice mask is drawn where ice should not be.
# can be the same as ice mask or can be different, if only certain areas should be analysed in the comparison tool, but has to be a polygon shapefile.
analyse_mask_file: ../paleoalps-extension/susten-run-paper-may/mask-susten.shp
glacier_history_file: glacier_history.nc # this is the file that contains the glacier history, if it exists, it will be used to override the lasticecover.nc file. If it does not exist, the lasticecover variable from the glacier output will be used.

# Tool infos:
# start_time / end_time in the units of year_format (start_time = older); both must be output frames (the closest
# frame within half of output_saving_frequency is accepted). Evidence is used only if its whole age window lies
# between start_time and end_time.
start_time: 14000.0
end_time: 0.0
# Analysis frequency in years
analysis_frequency: 100.0

# Weights for the single optimisation metrics. Defaults are given in comments
elevation_factor_weight: 10.0 # weight for the elevation factor distance, 1 means equal weight, 10 means higher weight to vertical distance.
confidence_rating_weights:
    high: 1.0
    medium: 1.0
    low: 0.0
density_weight: 2.0 # weight for the density distance, should be at least 1.0, if 1.0, then all weights for spatio-temporal density are between 1 and 1, if 2.0, then all weights are between 1 and 2 ..etc.
